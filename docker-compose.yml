services:
  rust:
    build:
      context: .
      # Root CAs of the HTTPS-inspecting proxy (Menlo/Kaspersky), so apk and cargo
      # can download inside the build. Only used during the build, not in the image.
      secrets:
        - extra-ca
    image: rust-boilerplate:latest
    container_name: rust-boilerplate
    env_file:
      - .env
    environment:
      IO_WORKER_COUNT: 320
    ports:
      - "3000:3000"
    cpus: 10.0
    mem_limit: 6g
    restart: unless-stopped

secrets:
  extra-ca:
    # Export the proxy's root CAs here (PEM). Not committed (see .gitignore).
    file: ./.certs/extra-ca.pem
